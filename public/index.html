<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProveBackBot 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F5;--card:#fff;--ink:#16204A;--ink2:#4A5378;--line:#C9CFDE;--ok:#1F7A4D;--okbg:#E3F2EA;--bad:#B3261E;--badbg:#FBE7E5;--wait:#8A5A00;--waitbg:#FBF0DA;
  --sans:"Instrument Sans","Noto Sans TC","PingFang TC",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1430;--card:#161E44;--ink:#E6E9F5;--ink2:#9BA3C4;--line:#2A3463;--ok:#47C487;--okbg:#12301F;--bad:#F06A5F;--badbg:#3A1714;--wait:#E0A33A;--waitbg:#33260C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-0.02em}
h2{font-size:1.1rem;margin:0 0 10px}
p.lede{color:var(--ink2);margin:0 0 22px;max-width:65ch}
.grid{display:grid;gap:18px}
@media(min-width:880px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font-size:.88rem;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
button{font:inherit;cursor:pointer;border-radius:999px;padding:8px 16px;font-weight:600;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3A5BD9;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
th{color:var(--ink2);font-weight:500;border-top:0}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.fail{background:var(--badbg);color:var(--bad)}.pill.pending{background:var(--waitbg);color:var(--wait)}
.qrbox{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.qrbox img{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px}
.note{font-size:.85rem;color:var(--ink2)}
a{color:inherit}
code{font-size:.85rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;max-width:90vw}
</style>
</head>
<body>
<main>
  <h1>ProveBackBot 控制台</h1>
  <p class="lede">設定 workspace 政策、讓成員 onboarding、建立會議並派 bot。沒有 Self App 時，可以用「模擬」按鈕測試完整流程。</p>

  <div class="grid">
    <section class="card">
      <h2 id="wsName">Workspace</h2>
      <label><input type="checkbox" id="strict" style="width:auto"> Strict mode：共用 QR 只接受已登記成員</label>
      <label for="banned">受限國籍（ISO 三碼，逗號分隔）</label>
      <input id="banned" placeholder="PRK, IRN">
      <div class="row"><button id="savePolicy">儲存政策</button></div>
      <div class="wrap" style="margin-top:14px"><table><thead><tr><th>成員</th><th>狀態</th><th></th></tr></thead><tbody id="members"></tbody></table></div>
      <div id="onboardBox"></div>
    </section>

    <section class="card">
      <h2>建立會議</h2>
      <label for="meetUrl">Google Meet 連結</label>
      <input id="meetUrl" placeholder="https://meet.google.com/xxx-yyyy-zzz">
      <label for="guests">預先登記的外部與會者（逗號分隔，可留空）</label>
      <input id="guests" placeholder="Alex Kim">
      <div class="row"><button id="createMeeting">建立會議</button></div>
      <div id="meetingBox" class="note" style="margin-top:12px"></div>
    </section>
  </div>

  <section class="card" style="margin-top:18px" id="seatsCard" hidden>
    <h2>與會者</h2>
    <div class="row">
      <input id="joinName" placeholder="模擬有人加入會議，輸入顯示名稱" style="flex:1;min-width:200px">
      <button class="ghost" id="join">模擬加入</button>
    </div>
    <div class="row">
      <span class="note">模擬有人掃描成員 QR：</span>
      <select id="memberPassport" style="width:auto"></select>
      <button class="ghost" id="simMember">模擬掃描</button>
    </div>
    <div class="wrap" style="margin-top:10px"><table><thead><tr><th>名稱</th><th>類型</th><th>狀態</th><th>說明</th><th>模擬訪客護照</th></tr></thead><tbody id="seats"></tbody></table></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const api = async (path, body) => {
    const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j;
  };
  const toast = (t) => { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (el.style.display = "none"), 3500); };
  const KIND = { member: "成員", guest: "外部", unknown: "未登記" };
  const STATUS = { ok: "已驗證", fail: "未通過", pending: "待驗證" };
  let ws, meetingId = (location.hash.match(/m-([0-9a-f]+)/) || [])[1];

  async function loadWs() {
    ws = await api("/api/workspace?id=demo");
    $("#wsName").textContent = `Workspace：${ws.name}`;
    $("#strict").checked = !!ws.policy.strict;
    $("#banned").value = (ws.policy.excludedCountries || []).join(", ");
    $("#members").innerHTML = ws.members.map((m) => `<tr><td>${esc(m.name)}<div class="note">${esc(m.email)}</div></td>
      <td><span class="pill ${m.onboarded ? "ok" : "pending"}">${m.onboarded ? "已綁定護照" : "未 onboarding"}</span></td>
      <td><button class="ghost" data-onboard="${esc(m.email)}">產生 onboarding QR</button></td></tr>`).join("");
    $("#memberPassport").innerHTML = ws.members.map((m) => `<option value="${esc(m.email)}">${esc(m.name)} 的護照</option>`).join("") + `<option value="__evil">冒充者自己的護照</option>`;
  }

  $("#savePolicy").onclick = async () => {
    const excludedCountries = $("#banned").value.split(/[,\s]+/).map((s) => s.trim().toUpperCase()).filter(Boolean);
    await api("/api/workspace?id=demo", { policy: { strict: $("#strict").checked, excludedCountries } });
    toast("政策已儲存"); loadWs();
  };

  document.addEventListener("click", async (e) => {
    const ob = e.target.closest("[data-onboard]"); if (ob) {
      const r = await api("/api/onboard", { workspaceId: "demo", email: ob.dataset.onboard });
      $("#onboardBox").innerHTML = `<div class="qrbox"><img src="/api/qr?s=${r.session}" alt="onboarding QR">
        <div class="note">請 <b>${esc(ob.dataset.onboard)}</b> 用 Self App 掃描。<br>正式流程會把 <a href="${esc(r.page)}" target="_blank">這個連結</a> 寄到成員信箱。
        <div class="row"><button class="ghost" data-simob="${r.session}" data-email="${esc(ob.dataset.onboard)}">模擬完成 onboarding</button></div></div></div>`;
    }
    const so = e.target.closest("[data-simob]"); if (so) {
      const m = ws.members.find((x) => x.email === so.dataset.email);
      const r = await api("/api/simulate", { session: so.dataset.simob, name: m.name.toUpperCase(), nationality: "USA", passportId: "P-" + m.email });
      toast(r.reason); $("#onboardBox").innerHTML = ""; loadWs();
    }
    const sg = e.target.closest("[data-simguest]"); if (sg) {
      const tr = sg.closest("tr");
      const r = await api("/api/simulate", { session: sg.dataset.simguest, name: tr.querySelector("[data-pname]").value, nationality: tr.querySelector("[data-nat]").value, passportId: "P-" + tr.querySelector("[data-pname]").value + tr.querySelector("[data-nat]").value });
      toast(r.reason); loadMeeting();
    }
  });

  $("#createMeeting").onclick = async () => {
    const m = await api("/api/meeting", { workspaceId: "demo", meetUrl: $("#meetUrl").value.trim(), guests: $("#guests").value.split(",").map((s) => s.trim()).filter(Boolean) });
    meetingId = m.id; location.hash = "m-" + m.id; loadMeeting();
  };

  async function loadMeeting() {
    if (!meetingId) return;
    let m; try { m = await api(`/api/meeting?id=${meetingId}`); } catch { return; }
    const screen = `${location.origin}/bot-screen.html?m=${m.id}`;
    $("#meetingBox").innerHTML = `會議 <code>${m.id}</code>｜<a href="${screen}" target="_blank">開啟 bot 畫面</a>（筆電分享此頁即可當退路）
      <div class="row">${m.botId ? `bot 已派出：<code>${esc(m.botId)}</code>` : `<button id="sendBot" ${m.meetUrl ? "" : "disabled"}>派 bot 進會議</button>`}</div>`;
    const sb = $("#sendBot"); if (sb) sb.onclick = async () => { try { const r = await api("/api/bot", { meetingId: m.id }); toast("bot 已派出：" + r.botId); loadMeeting(); } catch (e) { toast(e.message); } };
    $("#seatsCard").hidden = false;
    if (document.activeElement && document.activeElement.closest("#seats")) return; // 使用者正在輸入時不要重畫
    $("#seats").innerHTML = m.seats.map((s) => `<tr><td>${esc(s.name)}</td><td>${KIND[s.kind] || ""}</td>
      <td><span class="pill ${s.status}">${STATUS[s.status]}</span></td><td class="note">${esc(s.reason)}</td>
      <td>${s.kind === "guest" ? `<div class="row" style="margin:0"><input data-pname value="${esc(s.name.toUpperCase())}" style="width:130px" aria-label="護照姓名">
        <select data-nat style="width:auto" aria-label="國籍"><option>TWN</option><option>USA</option><option>JPN</option><option>IRN</option><option>PRK</option></select>
        <button class="ghost" data-simguest="${s.session}">模擬</button></div>` : ""}</td></tr>`).join("") || `<tr><td colspan="5" class="note">還沒有與會者。</td></tr>`;
  }

  $("#join").onclick = async () => { const name = $("#joinName").value.trim(); if (!name) return; await api(`/api/meeting?id=${meetingId}&action=join`, { name }); $("#joinName").value = ""; loadMeeting(); };
  $("#simMember").onclick = async () => {
    const m = await api(`/api/meeting?id=${meetingId}`); const v = $("#memberPassport").value;
    const mem = ws.members.find((x) => x.email === v);
    const r = await api("/api/simulate", mem ? { session: m.memberSession, name: mem.name.toUpperCase(), nationality: "USA", passportId: "P-" + mem.email }
                                             : { session: m.memberSession, name: "EVE MALLORY", nationality: "USA", passportId: "P-evil" });
    toast(r.reason); loadMeeting();
  };

  loadWs().catch((e) => toast("載入失敗：" + e.message));
  loadMeeting(); setInterval(loadMeeting, 3000);
})();
</script>
</body>
</html>
