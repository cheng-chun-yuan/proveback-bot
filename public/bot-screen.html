<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProveBackBot bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Built for Recall's 1280x720 camera feed; scales proportionally in a normal browser (handy as a laptop screen-share fallback) */
:root{--board:#14181a;--edge:#383b41;--paper:#f6f2ea;--panel:#fffdf9;--ink:#16181b;--ink2:#55585a;--dim:#979ea6;--line:#dcd6c9;--line2:#ebe6da;
  --green:#1f5c43;--green-deep:#174633;--green-bg:#e2eee6;--green-on-dark:#5fbf93;--amber:#f2a81d;--amber-bg:#fdf0d2;--amber-text:#8a5a00;--red:#b92d22;--red-bg:#fbe6e3;
  --sans:"Instrument Sans","Noto Sans TC","PingFang TC",system-ui,sans-serif;--serif:"Instrument Serif","Iowan Old Style",Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--board);color:#fff;font-family:var(--sans);overflow:hidden;font-variant-numeric:tabular-nums}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;display:grid;grid-template-columns:400px minmax(0,1fr);gap:40px;padding:44px}
.qrcard{background:#fff;color:var(--ink);border-radius:16px;padding:20px;display:flex;flex-direction:column}
.qrcard img{width:360px;height:360px;image-rendering:pixelated;display:block}
.qrcard h1{font:400 46px/1.05 var(--serif);margin:20px 0 8px}
.qrcard p{margin:0;font-size:21px;color:var(--ink2);line-height:1.3}
.qrcard .mark{margin:auto 0 0;font:400 26px/1 var(--serif)}
.side{display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:28px;padding-bottom:20px;border-bottom:1px solid var(--edge)}
.title{min-width:0}
.title b{display:block;font:400 48px/1.05 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--edge);border-radius:999px;padding:5px 13px;font-size:17px;color:var(--dim)}
.tally{display:flex;align-items:center;gap:18px;flex:none}
.tally svg{width:96px;height:96px}
.tally circle{fill:none;stroke-width:9}
.tally .track{stroke:#2c3134}
.tally .arc{stroke:var(--green-on-dark);stroke-linecap:round;transition:stroke-dasharray 400ms cubic-bezier(.16,1,.3,1)}
.tally .num{font:400 76px/1 var(--serif);white-space:nowrap}
.tally .num i{font-style:normal;color:var(--dim)}
.tally .lbl{font-size:22px;color:var(--dim);white-space:nowrap}
.roster{flex:1;display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--edge)}
.row.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:#22282b}100%{background:transparent}}
.who{min-width:0}
.nm{font-size:29px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{margin-left:.6em;font-size:.7em;color:var(--dim);letter-spacing:.04em}
.why{font-size:17px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;font-size:22px;font-weight:500;line-height:1;border-radius:999px;padding:9px 20px;white-space:nowrap}
.st.ok{background:var(--green-on-dark);color:#0c2018}.st.fail{background:#d6453a;color:#fff}.st.pending{box-shadow:inset 0 0 0 2px #4a4e55;color:var(--dim)}
.empty{color:var(--dim);font-size:28px;margin:auto 0}
.foot{margin-top:12px;font-size:18px;color:var(--dim);min-height:22px}
@media (prefers-reduced-motion:reduce){.row.flash{animation:none}.tally .arc{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="qrcard">
    <img id="qr" alt="Member verification QR code">
    <h1>Scan to verify</h1>
    <p>Members: scan with the Self app.<br>Guests: open your link in the chat.</p>
    <div class="mark">ProveBack</div>
  </section>
  <section class="side">
    <div class="head">
      <div class="title"><b id="ws">Loading…</b><div class="chips" id="chips"></div></div>
      <div class="tally" role="status" id="tally" hidden>
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="42"/><circle class="arc" id="arc" cx="50" cy="50" r="42" stroke-dasharray="0 264" transform="rotate(-90 50 50)"/></svg>
        <div><div class="num"><span id="okN">0</span><i> / <span id="allN">0</span></i></div><div class="lbl">verified</div></div>
      </div>
    </div>
    <div class="roster" id="roster"><div class="empty">Waiting for attendees to verify…</div></div>
    <div class="foot" id="foot"></div>
  </section>
</div>
<script>
(function () {
  "use strict";
  const id = new URLSearchParams(location.search).get("m");
  const stage = document.getElementById("stage");
  function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener("resize", fit); fit();
  if (!id) { document.getElementById("ws").textContent = "URL is missing ?m=<meeting ID>"; return; }

  const KIND = { member: "Member", guest: "External guest", unknown: "Unregistered" };
  const ICON = { ok: "Verified", fail: "Try again", pending: "Waiting" };
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let lastSig = {}, qrSet = false;

  async function tick() {
    try {
      const r = await fetch(`/api/meeting?id=${encodeURIComponent(id)}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const m = await r.json();
      if (!qrSet) { document.getElementById("qr").src = `/api/qr?s=${m.memberSession}`; qrSet = true; }
      const p = (m.workspace && m.workspace.policy) || {};
      document.getElementById("ws").textContent = (m.workspace && m.workspace.name) || "";
      document.getElementById("chips").innerHTML =
        (p.strict ? '<span class="chip">Strict mode: registered members only</span>' : "") +
        ((p.excludedCountries || []).length ? `<span class="chip">Restricted nationalities: ${esc(p.excludedCountries.join(", "))}</span>` : "");
      const seats = m.seats.slice().sort((a, b) => ({ pending: 0, fail: 1, ok: 2 }[a.status] - { pending: 0, fail: 1, ok: 2 }[b.status]));
      document.getElementById("roster").innerHTML = seats.length ? seats.slice(0, 6).map((s) => {
        const sig = s.status + s.reason; const flash = lastSig[s.seatId] !== undefined && lastSig[s.seatId] !== sig; lastSig[s.seatId] = sig;
        const why = s.status === "pending" ? (s.kind === "guest" ? "Open your personal link in the chat" : "Scan the QR code on the left") : s.reason;
        return `<div class="row${flash ? " flash" : ""}">
          <div class="who"><div class="nm">${esc(s.name)}${s.nationality ? `<small>${esc(s.nationality)}</small>` : ""}</div><div class="why">${esc(KIND[s.kind] || "")} · ${esc(why)}</div></div>
          <div class="st ${s.status}">${ICON[s.status]}</div></div>`;
      }).join("") : '<div class="empty">Waiting for attendees to verify…</div>';
      const ok = m.seats.filter((s) => s.status === "ok").length, bad = m.seats.filter((s) => s.status === "fail").length;
      document.getElementById("tally").hidden = false;
      document.getElementById("okN").textContent = ok; document.getElementById("allN").textContent = m.seats.length;
      document.getElementById("arc").setAttribute("stroke-dasharray", `${m.seats.length ? 263.9 * ok / m.seats.length : 0} 264`);
      document.getElementById("foot").textContent = bad ? `${bad} could not be verified` : "";
    } catch (e) { document.getElementById("foot").textContent = "Connection lost, retrying…"; }
  }
  tick(); setInterval(tick, 1500);
})();
</script>
</body>
</html>
